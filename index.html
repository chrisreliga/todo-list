<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Todo Tracker</title>
  </head>

  <body>
    <div class="main-container">
      <aside>
        <div class="sidebar-container" role="navigation">
          <h3>To Do Tracker</h3>
          <div class="top-sidebar">
            <ul>
              <li>
                <button type="button" class="active">
                  <i class="fa-regular fa-house"></i>Tasks <small>0</small>
                </button>
              </li>

              <li>
                <button type="button">
                  <i class="fa-regular fa-star"></i>Important <small>0</small>
                </button>
              </li>

              <li>
                <button type="button">
                  <i class="fa-regular fa-flag"></i>Flagged <small>0</small>
                </button>
              </li>

              <li>
                <button type="button">
                  <i class="fa-regular fa-trash-can"></i>Trash <small>0</small>
                </button>
              </li>
            </ul>
          </div>

          <div class="sidebar-separator"></div>

          <div class="bottom-sidebar">
            <div class="bottom-sidebar-functions">
              <button type="button" class="edit-btn">Edit</button>
              <button type="button" class="create-list-btn">
                Create list+
              </button>
            </div>

            <ul>
              <li class="sidebar-menu-item">
                <button type="button">
                  <span>🥑</span> Groceries <small>0</small>
                </button>
              </li>

              <li class="sidebar-menu-item">
                <button type="button">
                  <span>💻</span>Work <small>0</small>
                </button>
              </li>

              <li class="sidebar-menu-item">
                <button type="button">
                  <span>🏡</span>Home <small>0</small>
                </button>
              </li>

              <li class="sidebar-menu-item">
                <button type="button">
                  <span>🍿</span>Movies to watch <small>0</small>
                </button>
              </li>

              <li class="sidebar-menu-item">
                <button type="button">
                  <span>🍔</span>Places to eat <small>0</small>
                </button>
              </li>
            </ul>
          </div>

          <footer>
            <div class="color-theme">
              <p>
                Dark/Light Mode
                <button type="button" class="color-theme-toggle">
                  <i class="fa-solid fa-toggle-off"></i>
                </button>
              </p>
            </div>

            <p>Built by Christopher Religa</p>
          </footer>
        </div>
      </aside>

      <main>
        <h2>Tasks</h2>

        <div class="tasks-content">
          <ul class="task-list">
            <li class="task-list-item task-input-container">
              <i class="fa-regular fa-circle checkbox"></i>
              <input
                type="text"
                name="task input"
                id="task-input"
                placeholder="Enter task..."
              />
            </li>

            <li class="task-list-item">
              <button class="completed-btn">
                <i class="fa-regular fa-circle checkbox"></i></button
              >Existing task 1
            </li>
          </ul>

          <div class="task-list-functions">
            <button type="button" class="edit-btn">Edit List</button>
            <button type="button" class="add-task-btn">Add Task+</button>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
